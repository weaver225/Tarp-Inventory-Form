<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Champs Sports Grill – Spin the Menu!</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #C8102E;
    --gold: #F5A623;
    --dark: #111111;
    --darker: #0A0A0A;
    --mid: #1E1E1E;
    --light: #F0EDE8;
    --accent: #FFD700;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--darker);
    color: var(--light);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(ellipse at 20% 80%, rgba(200,16,46,0.12) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 20%, rgba(245,166,35,0.08) 0%, transparent 55%),
      repeating-linear-gradient(
        45deg,
        transparent,
        transparent 40px,
        rgba(255,255,255,0.012) 40px,
        rgba(255,255,255,0.012) 41px
      );
  }

  header {
    text-align: center;
    padding: 2rem 1rem 0.5rem;
  }

  .logo-line {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.2rem, 6vw, 4rem);
    letter-spacing: 0.08em;
    color: var(--accent);
    text-shadow: 0 0 30px rgba(255,215,0,0.4), 3px 3px 0 var(--red);
    line-height: 1;
  }

  .sub-line {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(0.85rem, 2.5vw, 1.1rem);
    letter-spacing: 0.3em;
    color: var(--gold);
    text-transform: uppercase;
    margin-top: 0.3rem;
    opacity: 0.85;
  }

  .divider {
    width: 120px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--red), var(--gold), transparent);
    margin: 0.8rem auto;
  }

  .category-tabs {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    padding: 0.8rem 1rem;
    max-width: 760px;
    margin: 0 auto;
  }

  .tab-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 0.35rem 0.9rem;
    border: 1.5px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.04);
    color: rgba(240,237,232,0.65);
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .tab-btn:hover, .tab-btn.active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
    box-shadow: 0 0 12px rgba(200,16,46,0.5);
  }

  .arena {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding: 1rem 1rem 2rem;
  }

  .wheel-wrap {
    position: relative;
    width: min(440px, 88vw);
    height: min(440px, 88vw);
    flex-shrink: 0;
  }

  /* Outer ring glow */
  .wheel-wrap::before {
    content: '';
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    background: conic-gradient(var(--red), var(--gold), var(--red), var(--gold), var(--red));
    z-index: 0;
    animation: ringPulse 3s ease-in-out infinite;
  }

  @keyframes ringPulse {
    0%,100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.02); }
  }

  /* Outer metal ring */
  .wheel-wrap::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #555, #111);
    z-index: 1;
    box-shadow: 0 8px 40px rgba(0,0,0,0.8);
  }

  canvas#wheel {
    position: relative;
    z-index: 2;
    border-radius: 50%;
    display: block;
    cursor: pointer;
  }

  /* Pointer */
  .pointer {
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7));
  }

  .pointer svg {
    width: 40px;
    height: 50px;
  }

  /* Center hub */
  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 64px;
    height: 64px;
    background: radial-gradient(circle at 35% 35%, #666, #1a1a1a);
    border-radius: 50%;
    z-index: 10;
    border: 3px solid var(--gold);
    box-shadow: 0 0 20px rgba(255,215,0,0.3), inset 0 2px 6px rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    color: var(--gold);
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s;
  }

  .hub:active { transform: translate(-50%,-50%) scale(0.93); }

  .spin-btn {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.3rem, 4vw, 1.7rem);
    letter-spacing: 0.12em;
    padding: 0.75rem 3rem;
    background: linear-gradient(135deg, var(--red) 0%, #8b0000 100%);
    color: #fff;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(200,16,46,0.45), inset 0 1px 0 rgba(255,255,255,0.15);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .spin-btn::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    transition: left 0.4s;
  }

  .spin-btn:hover::after { left: 150%; }
  .spin-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(200,16,46,0.6); }
  .spin-btn:active { transform: translateY(0); }
  .spin-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  /* Result card */
  .result-card {
    background: linear-gradient(135deg, rgba(200,16,46,0.12), rgba(30,30,30,0.9));
    border: 1px solid rgba(245,166,35,0.3);
    border-radius: 6px;
    padding: 1.4rem 2rem;
    text-align: center;
    max-width: 420px;
    width: 100%;
    opacity: 0;
    transform: translateY(16px) scale(0.96);
    transition: opacity 0.4s ease, transform 0.4s ease;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }

  .result-card.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .result-category {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.4rem;
  }

  .result-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    letter-spacing: 0.05em;
    color: #fff;
    text-shadow: 2px 2px 0 var(--red);
    line-height: 1.1;
  }

  .result-desc {
    font-size: 0.88rem;
    color: rgba(240,237,232,0.7);
    margin: 0.5rem 0;
    line-height: 1.5;
  }

  .result-price {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.5rem;
    color: var(--accent);
    letter-spacing: 0.08em;
  }

  .confetti-wrap {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }

  .confetti-piece {
    position: absolute;
    width: 8px;
    height: 12px;
    opacity: 0;
    animation: confettiFall 2.5s ease-in forwards;
  }

  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }

  .tick-indicator {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    color: rgba(240,237,232,0.35);
    text-transform: uppercase;
    margin-top: -0.5rem;
  }

  @media (min-width: 700px) {
    .arena {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 2rem 3rem;
      gap: 3rem;
    }
    .result-card { max-width: 340px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-line">🏆 Champs Sports Grill</div>
  <div class="sub-line">State College, PA — Spin the Menu!</div>
  <div class="divider"></div>
</header>

<div class="category-tabs" id="categoryTabs"></div>

<div class="arena">
  <div>
    <div class="wheel-wrap">
      <div class="pointer">
        <svg viewBox="0 0 40 50" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polygon points="20,48 2,4 38,4" fill="#C8102E" stroke="#FFD700" stroke-width="2"/>
          <circle cx="20" cy="8" r="5" fill="#FFD700"/>
        </svg>
      </div>
      <canvas id="wheel"></canvas>
      <div class="hub" id="hubBtn">SPIN</div>
    </div>
    <p class="tick-indicator" style="text-align:center;margin-top:0.6rem;">← click wheel or button to spin →</p>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;gap:1rem;">
    <button class="spin-btn" id="spinBtn">🎰 SPIN IT!</button>
    <div class="result-card" id="resultCard">
      <div class="result-category" id="resultCat"></div>
      <div class="result-name" id="resultName"></div>
      <div class="result-desc" id="resultDesc"></div>
      <div class="result-price" id="resultPrice"></div>
    </div>
  </div>
</div>

<div class="confetti-wrap" id="confettiWrap"></div>

<script>
const MENU = {
  "Appeteasers": [
    { name: "Philly Special", desc: "Cheesesteak eggroll — American, onions, mushrooms, sriracha ketchup", price: "$10.99" },
    { name: "Stanley's Wonder Wings", desc: "Choose 10, 20 or 40 wings: meek, arrogant, obnoxious, BBQ, southwestern, original, Harlicky, or Camp Raystown. Served with bleu cheese & celery", price: "From $15.99" },
    { name: "Bullfight Nachos", desc: "Fresh-cut tortilla chips, melted cheddar, sour cream, guacamole, salsa, chili, tomatoes, lettuce, scallions & jalapeños", price: "$13.59" },
    { name: "Buffalo Shrimp", desc: "Flash fried, tossed in Champs original wing sauce, served with bleu cheese", price: "$12.99" },
    { name: "Knuckle Ball", desc: "Softball-sized housemade meatball braised in red sauce, ricotta & basil", price: "$14.99" },
    { name: "Brock Crock of Mussels", desc: "Mussels, chorizo, shallots, garlic, fresh herbs & a crusty half-loaf for dipping", price: "$16.99" },
    { name: "Calamari", desc: "Tender calamari flash fried, on vodka sauce with provençal sauce", price: "$15.79" },
    { name: "Jaworski's Pierogies", desc: "Sautéed in butter and onions with sour cream", price: "$11.99" },
    { name: "Rollie Fingers", desc: "Fried chicken fingers with a side of ranch", price: "$11.99" },
  ],
  "Burgers": [
    { name: "All American", desc: "8 oz. grilled mushrooms, onions and American cheese. Lettuce, tomato, onion, pickle & chips", price: "$13.99" },
    { name: "New Yorker", desc: "8 oz. grilled bacon, mushrooms and Swiss. Lettuce, tomato, onion, pickle & chips", price: "$14.59" },
    { name: "Captain Lou Albano", desc: "8 oz. burger with hot sausage patty, sweet peppers, grilled onions, pepper jack cheese & mayo", price: "$14.99" },
    { name: "Cincy Bengal", desc: "Two 4-oz. smashed burgers stacked, American cheese, chili, onion, house-made mustard", price: "$13.99" },
    { name: "Roethlisberger", desc: "L,T,O, slaw, Thousand Island topped with fries", price: "$13.99" },
    { name: "Rampage Jackson", desc: "8oz burger, caramelized onions, roasted poblano peppers, cheddar & special BBQ sauce", price: "$14.59" },
    { name: "Champs Chickie", desc: "Staff favorite! Ground chicken blended with cheese & herbs, LTO, mayo on brioche", price: "$12.99" },
  ],
  "Favorites": [
    { name: "Cheesesteak", desc: "Classic Philly-style cheesesteak with grilled onions & your choice of cheese", price: "Market price" },
    { name: "Fish & Chips", desc: "Beer-battered cod, golden fries & tartar sauce", price: "Market price" },
    { name: "Chicken Parm", desc: "Breaded chicken, marinara & mozzarella on house bread", price: "Market price" },
  ],
  "Pizza": [
    { name: "Pepperoni Pizza", desc: "Classic pepperoni on housemade dough with red sauce & mozzarella", price: "Market price" },
    { name: "Buffalo Chicken Pizza", desc: "Buffalo sauce base, grilled chicken, mozzarella, bleu cheese drizzle", price: "Market price" },
    { name: "Margherita Pizza", desc: "Red sauce, fresh mozzarella, basil, EVOO", price: "Market price" },
  ],
  "Hoagies": [
    { name: "Italian Hoagie", desc: "Capicola, salami, ham, provolone, LTO, oil & vinegar on a long roll", price: "Market price" },
    { name: "Turkey Club", desc: "Roasted turkey, bacon, Swiss, LTO, mayo", price: "Market price" },
    { name: "Tuna Melt", desc: "Housemade tuna salad, cheddar, toasted on ciabatta", price: "Market price" },
  ],
  "Salads": [
    { name: "Chicken Caesar", desc: "Romaine, grilled chicken, house Caesar dressing, croutons, parmesan", price: "Market price" },
    { name: "Cobb Salad", desc: "Mixed greens, grilled chicken, bacon, egg, bleu cheese, tomato, avocado", price: "Market price" },
    { name: "Greek Salad", desc: "Romaine, kalamata olives, cucumbers, tomatoes, feta, red onion, Greek dressing", price: "Market price" },
  ],
  "Steaks": [
    { name: "NY Strip", desc: "12 oz. hand-cut NY strip, served with choice of two sides", price: "Market price" },
    { name: "Ribeye", desc: "14 oz. char-grilled ribeye with garlic butter & two sides", price: "Market price" },
    { name: "Sirloin Tips", desc: "Marinated sirloin tips, sautéed peppers & onions, choice of side", price: "Market price" },
  ],
  "Desserts": [
    { name: "Chocolate Brownie Sundae", desc: "Warm housemade brownie, vanilla ice cream, hot fudge, whipped cream", price: "Market price" },
    { name: "Cheesecake", desc: "New York-style cheesecake with strawberry topping", price: "Market price" },
  ],
};

const COLORS = [
  ["#C8102E","#fff"],["#1a1a2e","#FFD700"],["#8b0000","#F0EDE8"],
  ["#2d2d2d","#F5A623"],["#C8102E","#FFD700"],["#111827","#fff"],
  ["#7b1c1c","#F0EDE8"],["#1e3a5f","#F5A623"],
];

let currentCategory = "All";
let items = [];
let spinning = false;
let currentAngle = 0;
let animFrame = null;

function getAllItems() {
  const all = [];
  Object.entries(MENU).forEach(([cat, arr]) => arr.forEach(item => all.push({...item, category: cat})));
  return all;
}

function getItems(cat) {
  if (cat === "All") return getAllItems();
  return (MENU[cat] || []).map(i => ({...i, category: cat}));
}

// Build category tabs
const tabsEl = document.getElementById('categoryTabs');
["All", ...Object.keys(MENU)].forEach(cat => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (cat === "All" ? ' active' : '');
  btn.textContent = cat;
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = cat;
    items = getItems(cat);
    currentAngle = 0;
    hideResult();
    drawWheel(currentAngle);
  };
  tabsEl.appendChild(btn);
});

// Canvas setup
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const SIZE = Math.min(440, window.innerWidth * 0.88);
canvas.width = SIZE;
canvas.height = SIZE;

function drawWheel(rotation) {
  const cx = SIZE / 2, cy = SIZE / 2, r = SIZE / 2 - 4;
  ctx.clearRect(0, 0, SIZE, SIZE);
  if (!items.length) return;

  const sliceAngle = (Math.PI * 2) / items.length;

  items.forEach((item, i) => {
    const start = rotation + i * sliceAngle;
    const end = start + sliceAngle;
    const [bg, fg] = COLORS[i % COLORS.length];

    // Slice
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, start, end);
    ctx.closePath();
    ctx.fillStyle = bg;
    ctx.fill();

    // Border
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Label
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(start + sliceAngle / 2);
    ctx.textAlign = 'right';
    ctx.fillStyle = fg;

    const maxLen = 14;
    let label = item.name.length > maxLen ? item.name.substring(0, maxLen - 1) + '…' : item.name;

    const fontSize = Math.max(9, Math.min(14, SIZE / (items.length * 1.6)));
    ctx.font = `700 ${fontSize}px 'Barlow Condensed', sans-serif`;
    ctx.letterSpacing = '0.05em';
    ctx.fillText(label, r - 14, 4);
    ctx.restore();
  });

  // Inner shadow circle
  const grad = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r);
  grad.addColorStop(0, 'rgba(0,0,0,0.35)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
}

function getWinner(rotation) {
  // Pointer is at top = -π/2
  const norm = (((-rotation - Math.PI / 2) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
  const sliceAngle = (Math.PI * 2) / items.length;
  return Math.floor(norm / sliceAngle) % items.length;
}

function showResult(item) {
  const card = document.getElementById('resultCard');
  document.getElementById('resultCat').textContent = item.category;
  document.getElementById('resultName').textContent = item.name;
  document.getElementById('resultDesc').textContent = item.desc;
  document.getElementById('resultPrice').textContent = item.price;
  card.classList.add('visible');
  launchConfetti();
}

function hideResult() {
  document.getElementById('resultCard').classList.remove('visible');
}

function launchConfetti() {
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  const colors = ['#C8102E','#FFD700','#F5A623','#fff','#8b0000','#F0EDE8'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left: ${Math.random() * 100}vw;
      top: -10px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      transform: rotate(${Math.random() * 360}deg);
      animation-delay: ${Math.random() * 0.6}s;
      animation-duration: ${1.8 + Math.random() * 1.4}s;
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
    `;
    wrap.appendChild(el);
  }
  setTimeout(() => { wrap.innerHTML = ''; }, 4000);
}

function spin() {
  if (spinning || items.length === 0) return;
  spinning = true;
  hideResult();
  document.getElementById('spinBtn').disabled = true;

  const extraSpins = 6 + Math.random() * 4; // 6-10 full rotations
  const targetAngle = currentAngle + extraSpins * Math.PI * 2 + Math.random() * Math.PI * 2;
  const duration = 4000 + Math.random() * 1500;
  const startAngle = currentAngle;
  const startTime = performance.now();

  // Sound-like tick tracking
  let lastTick = 0;

  function easeOut(t) {
    return 1 - Math.pow(1 - t, 4);
  }

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const easedProgress = easeOut(progress);
    currentAngle = startAngle + (targetAngle - startAngle) * easedProgress;

    // Tick sound approximation via vibration / visual blip
    const tickInterval = (Math.PI * 2) / items.length;
    const tickPos = Math.floor(currentAngle / tickInterval);
    if (tickPos !== lastTick) {
      lastTick = tickPos;
    }

    drawWheel(currentAngle);

    if (progress < 1) {
      animFrame = requestAnimationFrame(animate);
    } else {
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      const winIdx = getWinner(currentAngle);
      showResult(items[winIdx]);
    }
  }

  animFrame = requestAnimationFrame(animate);
}

// Init
items = getItems("All");
drawWheel(0);

document.getElementById('spinBtn').addEventListener('click', spin);
document.getElementById('hubBtn').addEventListener('click', spin);
canvas.addEventListener('click', spin);
</script>
</body>
</html>
